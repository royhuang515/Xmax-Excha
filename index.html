<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>盲盒交換禮物調查箱</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'PingFang TC', 'Microsoft JhengHei', sans-serif;
    }
    body {
      background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
      color: #333;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }
    .card {
      background: rgba(255, 255, 255, 0.95);
      border-radius: 20px;
      box-shadow: 0 15px 35px rgba(0,0,0,0.3);
      width: 100%;
      max-width: 500px;
      padding: 30px;
      position: relative;
    }
    .settings-btn {
      position: absolute;
      top: 15px;
      right: 15px;
      background: #f0f0f0;
      border: none;
      border-radius: 20px;
      padding: 6px 12px;
      font-size: 12px;
      cursor: pointer;
      transition: 0.2s;
    }
    .settings-btn:hover {
      background: #e0e0e0;
    }
    h1 {
      color: #c0392b;
      font-size: 24px;
      text-align: center;
      margin-top: 10px;
      margin-bottom: 8px;
    }
    .subtitle {
      background: #e74c3c;
      color: white;
      text-align: center;
      padding: 6px 12px;
      border-radius: 15px;
      font-size: 14px;
      font-weight: bold;
      margin-bottom: 25px;
      display: inline-block;
      width: 100%;
    }
    .question-title {
      font-size: 16px;
      font-weight: bold;
      color: #2c3e50;
      margin-bottom: 6px;
    }
    .sub-desc {
      font-size: 13px;
      color: #7f8c8d;
      margin-bottom: 15px;
      line-height: 1.5;
    }
    textarea {
      width: 100%;
      height: 120px;
      padding: 12px;
      border: 2px solid #ddd;
      border-radius: 10px;
      font-size: 15px;
      resize: none;
      outline: none;
      transition: 0.3s;
    }
    textarea:focus {
      border-color: #27ae60;
    }
    .btn-submit {
      margin-top: 20px;
      width: 100%;
      padding: 14px;
      background: #27ae60;
      color: white;
      border: none;
      border-radius: 10px;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 4px 10px rgba(39, 174, 96, 0.3);
      transition: 0.2s;
    }
    .btn-submit:hover {
      background: #219150;
    }
    /* 彈窗樣式 */
    .modal {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.5);
      justify-content: center;
      align-items: center;
    }
    .modal-content {
      background: white;
      padding: 25px;
      border-radius: 15px;
      width: 90%;
      max-width: 400px;
    }
    .modal-content input {
      width: 100%;
      padding: 10px;
      margin: 15px 0;
      border: 1px solid #ccc;
      border-radius: 5px;
    }
  </style>
</head>
<body>

  <div class="card">
    <button class="settings-btn" onclick="openSettings()">⚙️ 主辦人設定</button>
    <h1>🎁 盲盒交換禮物調查箱</h1>
    <div class="subtitle">300元以內的盲盒、扭蛋、玩具類</div>

    <div class="question-title">我喜歡、我希望、我想要什麼樣的盲盒呢？</div>
    <div class="sub-desc">💡 各種形容都可以，像是古怪的、可愛的、動漫聯名等，<strong>不能直接講系列！</strong></div>

    <textarea id="userAnswer" placeholder="例：我喜歡搞怪又可愛的公仔，希望收到比較幽默、放在辦公桌上很療癒的盲盒..."></textarea>
    
    <button class="btn-submit" onclick="submitData()">送出</button>
  </div>

  <!-- 設定視窗 -->
  <div class="modal" id="settingsModal">
    <div class="modal-content">
      <h3>⚙️ 主辦人後端設定</h3>
      <p style="font-size: 12px; color: #666; margin-top: 5px;">請貼上你的 Google Web App URL：</p>
      <input type="text" id="scriptUrlInput" placeholder="https://script.google.com/macros/s/.../exec">
      <button onclick="saveSettings()" style="padding: 8px 15px; background: #27ae60; color: white; border: none; border-radius: 5px; cursor: pointer;">儲存設定</button>
      <button onclick="closeSettings()" style="padding: 8px 15px; background: #95a5a6; color: white; border: none; border-radius: 5px; cursor: pointer; margin-left: 5px;">取消</button>
    </div>
  </div>

  <script>
    // 打開與關閉設定視窗
    function openSettings() {
      document.getElementById('scriptUrlInput').value = localStorage.getItem('script_url') || '';
      document.getElementById('settingsModal').style.display = 'flex';
    }
    function closeSettings() {
      document.getElementById('settingsModal').style.display = 'none';
    }

    // 儲存 Google Apps Script URL
    function saveSettings() {
      const url = document.getElementById('scriptUrlInput').value.trim();
      if (!url) {
        alert('請輸入有效的 URL！');
        return;
      }
      localStorage.setItem('script_url', url);
      alert('主辦人連結設定完成！');
      closeSettings();
    }

    // 資料送出
    function submitData() {
      const answer = document.getElementById('userAnswer').value.trim();
      const scriptUrl = localStorage.getItem('script_url');

      if (!scriptUrl) {
        alert('請點選右上角「⚙️ 主辦人設定」，貼入你的 Google Apps Script 網址！');
        return;
      }

      if (!answer) {
        alert('請寫下你的想法再送出喔！');
        return;
      }

      // 發送資料到 Google Apps Script
      fetch(scriptUrl, {
        method: 'POST',
        mode: 'no-cors', // 避免跨網域限制
        headers: {
          'Content-Type': 'application/json'
        },
        body: JSON.stringify({ answer: answer })
      })
      .then(() => {
        alert('送出成功！主辦人已收到你的盲盒許願卡囉！');
        document.getElementById('userAnswer').value = '';
      })
      .catch(err => {
        alert('送出失敗，請檢查網路或網址設定：' + err);
      });
    }
  </script>
</body>
</html>
